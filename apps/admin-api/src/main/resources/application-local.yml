spring:
  datasource:
    url: jdbc:h2:file:${user.home}/.conecta-geracao/admin-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        default_schema: public
    open-in-view: false

  h2:
    console:
      # Console só neste perfil. Em outros perfis permanece desabilitado
      # e o SecurityConfig não libera /h2-console.
      enabled: true
      path: /h2-console

admin:
  seed:
    username: admin
    password: admin123
